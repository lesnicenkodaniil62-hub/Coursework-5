# ============================================
# Black — форматирование кода
# ============================================
# Black — code formatting
# ============================================
[tool.black]
line-length = 119
target-version = ['py312']
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# ============================================
# isort — сортировка импортов
# ============================================
# isort — import sorting
# ============================================
[tool.isort]
profile = "black"
line_length = 119
known_third_party = ["django", "rest_framework"]
skip = ["venv", ".venv", "migrations"]

# ============================================
# mypy — проверка типов
# ============================================
# mypy — static type checking
# ============================================
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
exclude = ["venv", ".venv", "migrations"]

# ============================================
# Модели наших приложений проверяем строго
# ============================================
# Our app models are checked strictly
# ============================================
[[tool.mypy.overrides]]
module = ["users.models", "habits.models"]
ignore_errors = false

# ============================================
# django-stubs — плагин типизации Django
# ============================================
# django-stubs — Django typing plugin
# ============================================
[tool.django-stubs]
django_settings_module = "config.settings"

# ============================================
# pytest — запуск тестов
# ============================================
# pytest — test runner
# ============================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

# ============================================
# coverage — измерение покрытия и исключения из статистики
# ============================================
# coverage — coverage measurement and exclusions
# ============================================
[tool.coverage.run]
source = ["users", "habits", "notifications", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/management/commands/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/celery.py",
]

# ============================================
# Порог покрытия — не ниже 80 процентов
# ============================================
# Coverage threshold — at least 80 percent
# ============================================
[tool.coverage.report]
fail_under = 80
show_missing = true